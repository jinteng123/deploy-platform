apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "deploy-platform.credentialPreflightName" . }}
  labels: {{ include "deploy-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-preflight
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "deploy-platform.name" . }}
        app.kubernetes.io/component: credential-preflight
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: {{ toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: credential-check
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["check-credentials"]
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: ENV
              value: "production"
            - name: MOCK_RUNTIME
              value: "false"
            - name: MYSQL_HOST
              value: {{ required "mysql.host is required" .Values.mysql.host | quote }}
            - name: MYSQL_PORT
              value: {{ .Values.mysql.port | quote }}
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.mysql.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "mysql.existingSecret.name is required" .Values.mysql.existingSecret.name }}
                  key: {{ .Values.mysql.existingSecret.passwordKey }}
            - name: DATABASE_DSN
              value: "$(MYSQL_USER):$(MYSQL_PASSWORD)@tcp($(MYSQL_HOST):$(MYSQL_PORT))/$(MYSQL_DATABASE)?parseTime=true&charset=utf8mb4"
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.credentialEncryptionKey.secretName is required" .Values.secrets.credentialEncryptionKey.secretName }}
                  key: {{ .Values.secrets.credentialEncryptionKey.key }}
            {{- if .Values.secrets.adminInitialPassword.secretName }}
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.adminInitialPassword.secretName }}
                  key: {{ .Values.secrets.adminInitialPassword.key }}
            {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
