apiVersion: v1
kind: Service
metadata:
  name: {{ include "deploy-platform.fullname" . }}
  labels: {{ include "deploy-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
  selector: {{ include "deploy-platform.selectorLabels" . | nindent 4 }}
